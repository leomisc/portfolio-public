<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Regional volume versus calibrated late-order rate</title><desc id="chart-description">A scatter plot comparing distinct orders and calibrated late-order rate across Central, East, South, and West.</desc><rect x="0.0" y="0.0" width="900.0" height="470.0" fill="#ffffff" stroke="none" rx="0.0"/><text x="78.0" y="31.0" font-family="Arial, sans-serif" font-size="21px" fill="#1f2937" text-anchor="start" font-weight="700">Regional volume vs. calibrated late-order rate</text><text x="78.0" y="53.0" font-family="Arial, sans-serif" font-size="12px" fill="#6b7280" text-anchor="start" font-weight="400">Each point is a region; a higher point means a higher share of orders shipped late.</text><line x1="130.0" y1="78.0" x2="130.0" y2="392.0" stroke="#d1d5db" stroke-width="0.8"/><text x="130.0" y="416.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">800</text><line x1="234.0" y1="78.0" x2="234.0" y2="392.0" stroke="#d1d5db" stroke-width="0.8"/><text x="234.0" y="416.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">1,000</text><line x1="338.0" y1="78.0" x2="338.0" y2="392.0" stroke="#d1d5db" stroke-width="0.8"/><text x="338.0" y="416.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">1,200</text><line x1="442.0" y1="78.0" x2="442.0" y2="392.0" stroke="#d1d5db" stroke-width="0.8"/><text x="442.0" y="416.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">1,400</text><line x1="546.0" y1="78.0" x2="546.0" y2="392.0" stroke="#d1d5db" stroke-width="0.8"/><text x="546.0" y="416.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">1,600</text><line x1=