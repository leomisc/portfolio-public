<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Calibrated late-order rate by ship mode and year</title><desc id="chart-description">A line chart showing annual calibrated late-order rates for Same Day, First Class, Second Class, and Standard Class from 2014 through 2017.</desc><rect x="0.0" y="0.0" width="960.0" height="500.0" fill="#ffffff" stroke="none" rx="0.0"/><text x="78.0" y="31.0" font-family="Arial, sans-serif" font-size="21px" fill="#1f2937" text-anchor="start" font-weight="700">Calibrated late-order rate by ship mode</text><text x="78.0" y="53.0" font-family="Arial, sans-serif" font-size="12px" fill="#6b7280" text-anchor="start" font-weight="400">The mode gap is mostly Same Day versus the other three modes; the annual pattern is not a clean trend.</text><line x1="78.0" y1="422.0" x2="740.0" y2="422.0" stroke="#d1d5db" stroke-width="0.8"/><text x="66.0" y="426.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="end" font-weight="400">0%</text><line x1="78.0" y1="345.6" x2="740.0" y2="345.6" stroke="#d1d5db" stroke-width="0.8"/><text x="66.0" y="349.6" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="end" font-weight="400">5%</text><line x1="78.0" y1="269.3" x2="740.0" y2="269.3" stroke="#d1d5db" stroke-width="0.8"/><text x="66.0" y="273.3" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="end" font-weight="400">10%</text><line x1="78.0" y1="192.9" x2="740.0" y2="192.9" stroke="#d1d5db" stroke-width="0.8"/><text x="66.0" y="196.9" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="end" font-weight="400">15%</text><line x1="78.0" y1="116.5" x2="740.0" y2="116.5" stroke="#d1d5db" stroke-width="0.8"/><text x="66.0" y="120.5" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="end" font-weight="400">20%</text><line x1="78.0" y1="86.0" x2="78.0" y2="422.0" stroke="#d1d5db" stroke-width="0.8"/><text x="78.0" y="446.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">2014</text><line x1="298.7" y1="86.0" x2="298.7" y2="422.0" stroke="#d1d5db" stroke-width="0.8"/><text x="298.7" y="446.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">2015</text><line x1="519.3" y1="86.0" x2="519.3" y2="422.0" stroke="#d1d5db" stroke-width="0.8"/><text x="519.3" y="446.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">2016</text><line x1="740.0" y1="86.0" x2="740.0" y2="422.0" stroke="#d1d5db" stroke-width="0.8"/><text x="740.0" y="446.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle" font-weight="400">2017</text><polyline points="78.0,390.2 298.7,335.6 519.3,360.1 740.0,387.7" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78.0" cy="390.2" r="2" fill="#059669"/><circle cx="298.7" cy="335.6" r="2" fill="#059669"/><circle cx="519.3" cy="360.1" r="2" fill="#059669"/><circle cx="740.0" cy="387.7" r="2" fill="#059669"/><polyline points="78.0,137.6 298.7,144.3 519.3,201.8 740.0,137.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78.0" cy="137.6" r="2" fill="#2563eb"/><circle cx="298.7" cy="144.3" r="2" fill="#2563eb"/><circle cx="519.3" cy="201.8" r="2" fill="#2563eb"/><circle cx="740.0" cy="137.0" r="2" fill="#2563eb"/><polyline points="78.0,180.9 298.7,155.1 519.3,184.1 740.0,186.3" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78.0" cy="180.9" r="2" fill="#d97706"/><circle cx="298.7" cy="155.1" r="2" fill="#d97706"/><circle cx="519.3" cy="184.1" r="2" fill="#d97706"/><circle cx="740.0" cy="186.3" r="2" fill="#d97706"/><polyline points="78.0,150.9 298.7,179.5 519.3,150.5 740.0,141.2" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78.0" cy="150.9" r="2" fill="#7c3aed"/><circle cx="298.7" cy="179.5" r="2" fill="#7c3aed"/><circle cx="519.3" cy="150.5" r="2" fill="#7c3aed"/><circle cx="740.0" cy="141.2" r="2" fill="#7c3aed"/><text x="763.0" y="68.0" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="start" font-weight="700">2017 rate</text><line x1="763.0" y1="86.0" x2="781.0" y2="86.0" stroke="#059669" stroke-width="3"/><text x="790.0" y="90.0" font-family="Arial, sans-serif" font-size="11px" fill="#059669" text-anchor="start" font-weight="700">Same Day: 2.2%</text><line x1="763.0" y1="114.0" x2="781.0" y2="114.0" stroke="#2563eb" stroke-width="3"/><text x="790.0" y="118.0" font-family="Arial, sans-serif" font-size="11px" fill="#2563eb" text-anchor="start" font-weight="700">First Class: 18.7%</text><line x1="763.0" y1="142.0" x2="781.0" y2="142.0" stroke="#d97706" stroke-width="3"/><text x="790.0" y="146.0" font-family="Arial, sans-serif" font-size="11px" fill="#d97706" text-anchor="start" font-weight="700">Second Class: 15.4%</text><line x1="763.0" y1="170.0" x2="781.0" y2="170.0" stroke="#7c3aed" stroke-width="3"/><text x="790.0" y="174.0" font-family="Arial, sans-serif" font-size="11px" fill="#7c3aed" text-anchor="start" font-weight="700">Standard Class: 18.4%</text><line x1="78.0" y1="422.0" x2="740.0" y2="422.0" stroke="#1f2937" stroke-width="1.1"/><line x1="78.0" y1="86.0" x2="78.0" y2="422.0" stroke="#1f2937" stroke-width="1.1"/><text x="409.0" y="475.0" font-family="Arial, sans-serif" font-size="12px" fill="#6b7280" text-anchor="middle" font-weight="400">Order year</text><text x="20.0" y="254.0" font-family="Arial, sans-serif" font-size="12px" fill="#6b7280" text-anchor="middle" font-weight="400" transform="rotate(-90 20 254.0)">Late-order rate</text></svg>
